title: Interactive Computing @ Illinois
description: >-
  Home page for Human-Computer Interaction research at the University
  of Illinois Urbana-Champaign, with updates on latest news and papers.
lang: en

url: "https://interactive-computing-uiuc.github.io"
baseurl: ""

timezone: America/Chicago
markdown: kramdown
# A writeup dated on a future publication day should still appear.
future: true

kramdown:
  input: GFM
  hard_wrap: false

# No theme. Layouts in this repo are the whole design. GitHub Pages would
# otherwise fall back to Minima for any missing layout.
plugins: []

exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - README.md
  - templates
  - agent-tools
  - node_modules

collections:
  talks:
    output: true
    permalink: /seminar/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: posts
    values:
      layout: post
      section: news
      permalink: /news/:year/:month/:day/:title/
  - scope:
      type: talks
    values:
      layout: talk
      section: seminar
