<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.section == "home" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="shortcut icon" href="https://cdn.brand.illinois.edu/favicon.ico">
  <link rel="apple-touch-icon" href="https://cdn.brand.illinois.edu/touch-icon-180x180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.brand.illinois.edu/components/il-header.css">
  <link rel="stylesheet" href="https://cdn.brand.illinois.edu/components/il-footer.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script type="module" src="https://cdn.brand.illinois.edu/components/il-header.mjs"></script>
  <script type="module" src="https://cdn.brand.illinois.edu/components/il-footer.mjs"></script>
  {% if page.section == "news" and page.layout != "post" %}
    <script src="{{ '/assets/js/news.js' | relative_url }}" defer></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
